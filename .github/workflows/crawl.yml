name: Crawl VÖBB games
on:
  schedule:
    # 23:47 UTC = 01:47 Berlin in summer, 00:47 in winter: even a run that uses the full
    # 5.5 hours (plus GitHub's usual start delay) is done before 08:00 Berlin time.
    - cron: "47 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python crawler.py games.json
      - name: Save games.json
        run: |
          git config user.name "voebb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || git commit -m "Update games $(date -u +%F)"
          git push
