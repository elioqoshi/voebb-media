<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Library games Berlin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --card:#FFFFFF; --ink:#14213D; --soft:#5B6478; --line:#D5DAE2;
  --yellow:#F2C800; --on-yellow:#14213D; --free:#1F8A4C; --busy:#9AA1AE;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --side:280px;
  /* Status colours: green only for copies you can borrow now, neutral grey for everything else */
  --success:#1F8A4C; --success-bg:#E2F3E9; --success-fg:#15653A;
  --neutral:#9AA1AE; --neutral-bg:#E6E9EF; --neutral-fg:#4A5366;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1628; --card:#16213A; --ink:#E8ECF3; --soft:#9AA3B6; --line:#26324D;
    --free:#43C07A; --busy:#5B6478;
    --success:#43C07A; --success-bg:#153A27; --success-fg:#86DEAA;
    --neutral:#5B6478; --neutral-bg:#222E47; --neutral-fg:#AEB6C8;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.page{display:grid;grid-template-columns:minmax(var(--side),25%) minmax(0,1fr)}

/* Sidebar: a full-height left column. The side padding keeps focus rings and the scrollbar clear of the content. */
.filters{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;
  padding:24px 28px 40px;border-right:1px solid var(--line);display:grid;gap:22px;align-content:start}
.filters-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.filters-head h2{font:800 22px/1 var(--display);margin:0;margin-right:auto}
.reset{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer}
.reset:disabled{opacity:.45;cursor:default}
#closeFilters{display:none}
.group h2{font:800 15px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
.group-top{display:flex;justify-content:space-between;align-items:baseline}
.group-top h2{margin-bottom:10px}
.links{display:flex;gap:10px;font-size:13px}
.links button{border:0;background:none;padding:0;color:var(--soft);text-decoration:underline;cursor:pointer}
input[type=search]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;font-size:16px}
select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px}
.check{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--ink)}
.check .n{margin-left:auto;color:var(--soft);font-size:13px;font-variant-numeric:tabular-nums}
.check.off{color:var(--soft)}
.plat-list .check input,.shelf input{accent-color:var(--free)}

.district{border-top:1px solid var(--line)}
.dhead{display:flex;align-items:center;gap:10px}
.dhead input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--ink);cursor:pointer}
.dtoggle{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;padding:9px 0;text-align:left;font-weight:700;font-size:15px;cursor:pointer}
.dtoggle .n{margin-left:auto;color:var(--soft);font-size:13px;font-weight:400;font-variant-numeric:tabular-nums}
.chev{width:10px;height:10px;flex:none;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);transform:rotate(-45deg);margin:0 4px 0 2px}
.dtoggle[aria-expanded="true"] .chev{transform:rotate(45deg)}
.district .libs{padding:0 0 8px 28px}
.district .libs .check{font-size:14px;padding:3px 0}
.closed{color:var(--soft);font-size:12px}

/* Results */
main{min-width:0;padding:24px 40px 40px}
h1{font:800 clamp(34px,6vw,52px)/.95 var(--display);letter-spacing:-.02em;margin:0}
.meta{color:var(--soft);font-size:14px;margin:8px 0 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 4px}
.count{color:var(--soft);font-size:14px;margin:0}
.open-filters{display:none;border:2px solid var(--ink);background:var(--yellow);color:var(--on-yellow);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}

/* Tags name what a thing is (platform). Badges say what state it is in. */
.tag{display:inline-flex;align-items:center;font:700 12px/1 var(--body);letter-spacing:.02em;padding:3px 6px;border:1.5px solid var(--line);border-radius:6px;color:var(--ink);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;line-height:1;padding:4px 9px 4px 8px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.badge.success{background:var(--success-bg);color:var(--success-fg)}
.badge.neutral{background:var(--neutral-bg);color:var(--neutral-fg)}

/* Active filter chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 3px 3px 11px;font-size:13px}
.chip button{border:0;background:none;width:24px;height:24px;border-radius:50%;cursor:pointer;color:var(--soft);font-size:16px;line-height:1}
.chip button:hover{background:var(--neutral-bg);color:var(--ink)}
.chips .clear{border:0;background:none;padding:4px 6px;font-size:13px;color:var(--soft);text-decoration:underline;cursor:pointer}

/* Game list */
ul.games{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.game{border-bottom:1px solid var(--line)}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:6px 20px;width:100%;padding:14px 4px;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--card) 55%,transparent)}
.row:focus-visible{outline:3px solid var(--yellow);outline-offset:-3px;border-radius:6px}
.title{display:block;font-weight:650;font-size:17px;line-height:1.3}
.facts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:7px}
.sub{color:var(--soft);font-size:13px}
.meter{display:flex;gap:2px;width:112px;height:6px}
.meter i{display:block;border-radius:3px;min-width:4px}
.meter .m-shelf{background:var(--success)}
.meter .m-out{background:var(--neutral)}
.meter .m-gone{background:var(--neutral);opacity:.4}
.row .chev{margin:0 6px 0 0}
.row[aria-expanded="true"] .chev{transform:rotate(45deg)}

/* Copies inside an open game */
.detail{padding:4px 4px 18px}
.cgroup + .cgroup{margin-top:14px}
.cgroup h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.cgroup h3 .n{font-weight:600;background:var(--neutral-bg);color:var(--neutral-fg);border-radius:999px;padding:2px 7px;letter-spacing:0}
.clist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.crow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 11rem;align-items:center;gap:4px 16px;padding:10px 14px}
.crow > .badge{justify-self:end}
.crow + .crow{border-top:1px solid var(--line)}
.lname{font-weight:600;font-size:15px}
.ldist,.cshelf{color:var(--soft);font-size:13px}
.cnote{grid-column:1/-1;font-size:13px;color:var(--soft);display:flex;gap:6px}
.cnote::before{content:"Note";font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--neutral-fg);background:var(--neutral-bg);border-radius:4px;padding:2px 5px;align-self:start}
.cgroup.muted .crow{opacity:.75}
.reserve{display:inline-flex;align-items:center;gap:6px;margin-top:14px;border:1.5px solid var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;color:inherit;text-decoration:none}
.reserve:hover{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}

@media (max-width:560px){
  .row{grid-template-columns:minmax(0,1fr) auto;padding:14px 0}
  .meter{display:none}
  .detail{padding:4px 0 18px}
  .crow{grid-template-columns:minmax(0,1fr);gap:6px}
  .crow > .badge{grid-row:2;justify-self:start}
}

.empty{padding:32px 0;color:var(--soft)}
.empty h2{font:800 24px/1.1 var(--display);color:var(--ink);margin:0 0 8px}
.empty ol{padding-left:20px}
.empty .reset{margin-top:6px}

.scrim{display:none}

/* Phones and small tablets: sidebar slides in from the left */
@media (max-width:860px){
  .page{grid-template-columns:minmax(0,1fr)}
  main{padding:20px 16px 40px}
  .open-filters{display:inline-block}
  .filters{position:fixed;inset:0 auto 0 0;z-index:20;width:min(90vw,380px);height:100%;border-right:0;
    background:var(--paper);padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));
    transform:translateX(-105%);visibility:hidden;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .filters.shown{transform:none;visibility:visible}
  .filters-head{position:sticky;top:0;z-index:1;background:var(--paper);
    padding:calc(14px + env(safe-area-inset-top,0px)) 0 12px;border-bottom:1px solid var(--line)}
  #closeFilters{display:block;border:0;background:var(--yellow);color:var(--on-yellow);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
  .scrim.shown{display:block;position:fixed;inset:0;z-index:15;background:rgba(10,15,30,.5)}
}
@media (prefers-reduced-motion:no-preference){
  .filters{transition:transform .2s ease-out,visibility .2s}
  .detail{animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translateY(-4px)}}
  .chev{transition:transform .15s}
}
</style>
</head>
<body>
<div class="page">
  <aside class="filters" id="filters" aria-label="Filters and sorting">
    <div class="filters-head"><h2>Filters</h2><button class="reset" id="reset">Reset</button><button id="closeFilters">Show games</button></div>

    <div class="group">
      <h2><label for="q">Search</label></h2>
      <input type="search" id="q" placeholder="Search a game" autocomplete="off">
    </div>

    <div class="group">
      <h2><label for="sort">Sort by</label></h2>
      <select id="sort">
        <option value="az">Title A–Z</option>
        <option value="za">Title Z–A</option>
        <option value="free">Most on the shelf</option>
        <option value="copies">Most copies</option>
      </select>
    </div>

    <div class="group">
      <h2>Availability</h2>
      <label class="check shelf"><input type="checkbox" id="freeOnly"> Only games on the shelf now</label>
    </div>

    <fieldset class="group" style="border:0;margin:0;padding:0">
      <div class="group-top"><h2>Platform</h2><div class="links"><button data-all="plat">All</button><button data-none="plat">None</button></div></div>
      <div class="plat-list" id="platList"></div>
    </fieldset>

    <fieldset class="group" style="border:0;margin:0;padding:0">
      <div class="group-top"><h2>Libraries</h2><div class="links"><button data-all="lib">All</button><button data-none="lib">None</button></div></div>
      <div id="libList"></div>
    </fieldset>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main>
    <h1>Library games<br>in Berlin</h1>
    <p class="meta" id="updated">Loading…</p>
    <div class="bar">
      <p class="count" id="count" aria-live="polite"></p>
      <button class="open-filters" id="openFilters" aria-controls="filters" aria-expanded="false">Filters &amp; sort</button>
    </div>
    <div class="chips" id="chips" aria-label="Active filters"></div>
    <ul class="games" id="list"></ul>
    <div class="empty" id="empty" hidden></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch{ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }
};
const PLATFORMS = ["PS5", "PS4", "Switch 2", "Switch"];
// Everything is on by default, so we remember what the viewer switched off.
const saved = store.get("filters", {});
const state = {
  games: [], libs: [],
  q: saved.q || "", sort: saved.sort || "az", freeOnly: !!saved.freeOnly,
  offPlat: new Set(saved.offPlat || []), offLib: new Set(saved.offLib || []),
  openDistricts: new Set(saved.openDistricts || [])
};
function save(){
  store.set("filters", {q: state.q, sort: state.sort, freeOnly: state.freeOnly,
    offPlat: [...state.offPlat], offLib: [...state.offLib], openDistricts: [...state.openDistricts]});
}
const isDefault = () => !state.q.trim() && state.sort === "az" && !state.freeOnly && !state.offPlat.size && !state.offLib.size;

// VÖBB statuses look like "Ausgeliehen - Fällig am: 20.10.2026 - Hülle beschädigt":
// a base status, a due date for loans, then an optional staff note about the copy's condition.
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const fmtDay = d => d.toLocaleDateString("en-GB", {day: "numeric", month: "short"});
const statusCache = new Map();
function copyStatus(raw){
  if (statusCache.has(raw)) return statusCache.get(raw);
  const parts = (raw || "").split(/\s+-\s+/);
  const base = parts.shift() || "";
  let kind, tone, label, due = null;
  if (/^verfügbar/i.test(base)){
    kind = "shelf"; tone = "success"; label = /zurückverbucht/i.test(base) ? "Just returned" : "On shelf";
  } else if (/^ausgeliehen/i.test(base)){
    const m = (parts[0] || "").match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
    if (m){ parts.shift(); due = new Date(+m[3], m[2] - 1, +m[1]); }
    kind = "out";
    if (due && due < TODAY){ tone = "neutral"; label = `Overdue since ${fmtDay(due)}`; }
    else { tone = "neutral"; label = due ? `On loan · due ${fmtDay(due)}` : "On loan"; }
  } else if (/^reserviert/i.test(base)){
    kind = "out"; tone = "neutral"; label = "Reserved";
  } else if (/^nicht im regal/i.test(base)){
    kind = "gone"; tone = "neutral"; label = "Not on shelf";
  } else if (/verloren/i.test(base)){
    kind = "gone"; tone = "neutral"; label = "Lost";
  } else if (/vermisst/i.test(base)){
    kind = "gone"; tone = "neutral"; label = "Missing";
  } else {
    kind = "gone"; tone = "neutral"; label = base || "Unknown";
  }
  const s = {kind, tone, label, due, note: parts.join(" – ")};
  statusCache.set(raw, s);
  return s;
}
const isFree = raw => copyStatus(raw).kind === "shelf";
const lostOrMissing = raw => /verloren|vermisst/i.test(raw || "");

function tagEl(p){ const t = document.createElement("span"); t.className = "tag"; t.textContent = p; return t; }
function badgeEl(tone, text){ const b = document.createElement("span"); b.className = "badge " + tone; b.textContent = text; return b; }
const cleanTitle = t => t.replace(/\s*\[.*?\]\s*/g, " ").replace(/^["'„“]+|["'“”]+$/g, "").trim();
const plural = (n, one, many) => `${n.toLocaleString("en")} ${n === 1 ? one : many}`;

// VÖBB names libraries "District: Name". A few come without a district.
const NO_DISTRICT = {"Bodo-Uhse-Bibliothek": "Lichtenberg", "Stadtteilbibliothek Hakenfelde": "Spandau"};
const DISTRICT_NAMES = {"Neukoelln": "Neukölln", "Tempelhof-Schoeneberg": "Tempelhof-Schöneberg",
  "Treptow-Koepenick": "Treptow-Köpenick", "ZLB": "Zentral- und Landesbibliothek"};
function parseLib(raw){
  let l = (raw || "Unknown library").trim(), closed = false;
  const c = l.match(/\s*-\s*ist zurzeit geschlossen$/i);
  if (c){ closed = true; l = l.slice(0, c.index); }
  let district, name;
  const m = l.match(/^([^:]+):\s*(.+)$/);
  if (m){ district = m[1]; name = m[2]; } else { district = NO_DISTRICT[l] || "Other"; name = l; }
  return {raw, district: DISTRICT_NAMES[district] || district, name, closed};
}
const libInfo = new Map();
const lib = raw => { if (!libInfo.has(raw)) libInfo.set(raw, parseLib(raw)); return libInfo.get(raw); };

function load(data){
  state.games = data.games || [];
  $("#updated").textContent = data.updated
    ? "Updated " + new Date(data.updated).toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"})
    : "Not crawled yet";
  state.libs = [...new Set(state.games.flatMap(g => (g.copies||[]).map(c => c.library)).filter(Boolean))];
  buildPlatList(); buildLibList(); render();
}

const visibleCopies = g => (g.copies || []).filter(x => !state.offLib.has(x.library));

function matches(g){
  if (state.offPlat.has(g.platform)) return false;
  const q = state.q.trim().toLowerCase();
  if (q && !g.title.toLowerCase().includes(q)) return false;
  const c = visibleCopies(g);
  if (state.offLib.size && !c.length) return false;
  if (state.freeOnly && !c.some(x => isFree(x.status))) return false;
  return true;
}

const SORTS = {
  az: (a, b) => a.g.title.localeCompare(b.g.title, "de"),
  za: (a, b) => b.g.title.localeCompare(a.g.title, "de"),
  free: (a, b) => b.shelf - a.shelf || b.active - a.active || SORTS.az(a, b),
  copies: (a, b) => b.active - a.active || b.shelf - a.shelf || SORTS.az(a, b)
};

// Everything a result row needs, worked out from the copies in the ticked libraries.
function summarise(g){
  const c = visibleCopies(g);
  let shelf = 0, out = 0, gone = 0, nextDue = null;
  const libs = new Set();
  for (const x of c){
    const s = copyStatus(x.status);
    if (s.kind === "shelf") shelf++;
    else if (s.kind === "out"){ out++; if (s.due && s.due >= TODAY && (!nextDue || s.due < nextDue)) nextDue = s.due; }
    else gone++;
    if (!lostOrMissing(x.status)) libs.add(x.library);
  }
  const active = c.filter(x => !lostOrMissing(x.status)).length;
  return {g, c, shelf, out, gone, active, libs: libs.size, nextDue};
}

function renderChips(){
  const box = $("#chips"); box.textContent = "";
  const chips = [];
  if (state.q.trim()) chips.push([`Search: “${state.q.trim()}”`, () => { state.q = ""; }]);
  if (state.freeOnly) chips.push(["On the shelf now", () => { state.freeOnly = false; }]);
  if (state.offPlat.size){
    const on = [...platChecks.keys()].filter(p => !state.offPlat.has(p));
    chips.push([`Platform: ${on.length ? on.join(", ") : "none"}`, () => state.offPlat.clear()]);
  }
  if (state.offLib.size){
    const on = state.libs.filter(l => !state.offLib.has(l));
    const districts = new Set(on.map(l => lib(l).district));
    const whole = districts.size === 1 && districtChecks.some(d => d.libs.length === on.length && d.libs.every(l => on.includes(l)));
    chips.push([`Libraries: ${whole ? [...districts][0] : `${on.length} of ${state.libs.length}`}`, () => state.offLib.clear()]);
  }
  for (const [text, clear] of chips){
    const chip = document.createElement("span"); chip.className = "chip"; chip.append(text);
    const x = document.createElement("button"); x.textContent = "×"; x.setAttribute("aria-label", `Remove filter ${text}`);
    x.onclick = () => { clear(); saveAndRender(); };
    chip.append(x); box.append(chip);
  }
  if (chips.length > 1){
    const all = document.createElement("button"); all.className = "clear"; all.textContent = "Clear all"; all.onclick = resetFilters;
    box.append(all);
  }
}

function buildRow({g, c, shelf, out, gone, active, libs, nextDue}){
  const li = document.createElement("li"); li.className = "game";
  const btn = document.createElement("button"); btn.className = "row"; btn.setAttribute("aria-expanded", "false");

  const main = document.createElement("span");
  const t = document.createElement("span"); t.className = "title"; t.textContent = cleanTitle(g.title);
  const facts = document.createElement("span"); facts.className = "facts";
  facts.append(tagEl(g.platform));
  const sub = document.createElement("span"); sub.className = "sub";
  if (!c.length){ facts.append(badgeEl("neutral", "No copy info")); }
  else if (shelf){ facts.append(badgeEl("success", `${shelf} on shelf`)); sub.textContent = `${plural(active, "copy", "copies")} in ${plural(libs, "library", "libraries")}`; }
  else if (out){ facts.append(badgeEl("neutral", "All on loan")); sub.textContent = nextDue ? `Next due back ${fmtDay(nextDue)}` : "All overdue"; }
  else { facts.append(badgeEl("neutral", "Unavailable")); sub.textContent = active ? "Not on the shelf right now" : "All copies lost or missing"; }
  if (sub.textContent) facts.append(sub);
  main.append(t, facts);

  // A small stacked bar: on shelf / on loan / unavailable. The badge already says it in words.
  const meter = document.createElement("span"); meter.className = "meter"; meter.setAttribute("aria-hidden", "true");
  for (const [n, cls] of [[shelf, "m-shelf"], [out, "m-out"], [gone, "m-gone"]]){
    if (!n) continue;
    const i = document.createElement("i"); i.className = cls; i.style.flex = n; meter.append(i);
  }
  const chev = document.createElement("span"); chev.className = "chev"; chev.setAttribute("aria-hidden", "true");
  btn.append(main, meter, chev);

  let detail = null;
  btn.onclick = () => {
    if (!detail){ detail = buildDetail(g, c); li.append(detail); }
    const open = btn.getAttribute("aria-expanded") !== "true";
    btn.setAttribute("aria-expanded", String(open)); detail.hidden = !open;
  };
  li.append(btn);
  return li;
}

const byPlace = (x, y) => lib(x.library).district.localeCompare(lib(y.library).district, "de")
  || lib(x.library).name.localeCompare(lib(y.library).name, "de");

function buildDetail(g, c){
  const detail = document.createElement("div"); detail.className = "detail";
  const groups = [
    ["On the shelf", "shelf", byPlace],
    ["On loan", "out", (x, y) => (copyStatus(x.status).due || 0) - (copyStatus(y.status).due || 0) || byPlace(x, y)],
    ["Unavailable", "gone", byPlace]
  ];
  for (const [title, kind, order] of groups){
    const items = c.filter(x => copyStatus(x.status).kind === kind).sort(order);
    if (!items.length) continue;
    const sec = document.createElement("section"); sec.className = "cgroup" + (kind === "gone" ? " muted" : "");
    const h = document.createElement("h3"); h.textContent = title;
    const n = document.createElement("span"); n.className = "n"; n.textContent = items.length; h.append(n);
    const ul = document.createElement("ul"); ul.className = "clist";
    for (const x of items){
      const info = lib(x.library), s = copyStatus(x.status);
      const r = document.createElement("li"); r.className = "crow";
      const place = document.createElement("div");
      const nm = document.createElement("div"); nm.className = "lname"; nm.textContent = info.name + (info.closed ? " (closed)" : "");
      const ds = document.createElement("div"); ds.className = "ldist"; ds.textContent = info.district;
      place.append(nm, ds);
      const shelfEl = document.createElement("div"); shelfEl.className = "cshelf"; shelfEl.textContent = x.shelf || "";
      r.append(place, shelfEl, badgeEl(s.tone, s.label));
      if (s.note){ const note = document.createElement("div"); note.className = "cnote"; note.textContent = s.note; r.append(note); }
      ul.append(r);
    }
    sec.append(h, ul); detail.append(sec);
  }
  if (g.url){
    const a = document.createElement("a"); a.className = "reserve"; a.href = g.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Reserve in VÖBB ↗"; detail.append(a);
  }
  return detail;
}

function render(){
  $("#freeOnly").checked = state.freeOnly;
  $("#sort").value = state.sort;
  if ($("#q").value !== state.q) $("#q").value = state.q;
  $("#reset").disabled = isDefault();
  syncChecks();

  const list = $("#list"); list.textContent = "";
  const empty = $("#empty");

  if (!state.games.length){
    $("#count").textContent = "";
    empty.hidden = false;
    empty.innerHTML = `<h2>No games yet</h2>
      <p>The crawler hasn't filled this list yet.</p>
      <ol><li>Open your repo on GitHub, then Actions.</li><li>Pick "Crawl VÖBB games" and tap Run workflow.</li><li>Come back in about an hour.</li></ol>`;
    return;
  }

  renderChips();
  const rows = state.games.filter(matches).map(summarise).sort(SORTS[state.sort] || SORTS.az);

  empty.hidden = rows.length > 0;
  if (!rows.length){
    empty.innerHTML = `<h2>Nothing matches</h2><p>Try another search, tick more platforms or libraries, or turn off "Only games on the shelf now".</p>
      <button class="reset">Reset all filters</button>`;
    empty.querySelector("button").onclick = resetFilters;
  }
  const label = plural(rows.length, "game", "games");
  $("#count").textContent = label;
  $("#closeFilters").textContent = `Show ${label}`;

  const frag = document.createDocumentFragment();
  for (const r of rows) frag.append(buildRow(r));
  list.append(frag);
}

function checkRow(text, n, onchange){
  const lab = document.createElement("label"); lab.className = "check";
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.onchange = () => onchange(cb.checked);
  const span = document.createElement("span"); span.append(text);
  lab.append(cb, span);
  if (n != null){ const c = document.createElement("span"); c.className = "n"; c.textContent = n; lab.append(c); }
  return {lab, cb};
}

const platChecks = new Map(), libChecks = new Map(), districtChecks = [];

function buildPlatList(){
  const box = $("#platList"); box.textContent = ""; platChecks.clear();
  const counts = {};
  for (const g of state.games) counts[g.platform] = (counts[g.platform] || 0) + 1;
  const plats = [...PLATFORMS, ...Object.keys(counts).filter(p => !PLATFORMS.includes(p))];
  for (const p of plats){
    const {lab, cb} = checkRow(tagEl(p), (counts[p] || 0).toLocaleString("en"), on => { setOff(state.offPlat, [p], !on); saveAndRender(); });
    if (!counts[p]) lab.classList.add("off");
    platChecks.set(p, cb); box.append(lab);
  }
}

function buildLibList(){
  const box = $("#libList"); box.textContent = ""; libChecks.clear(); districtChecks.length = 0;
  if (!state.libs.length){ box.textContent = "Libraries show up here once games are loaded."; return; }
  const byDistrict = new Map();
  for (const raw of state.libs){
    const d = lib(raw).district;
    if (!byDistrict.has(d)) byDistrict.set(d, []);
    byDistrict.get(d).push(raw);
  }
  // Berlin districts first, then the central library and anything unmatched
  const last = d => d === "Zentral- und Landesbibliothek" || d === "Other";
  const districts = [...byDistrict.keys()].sort((a, b) => last(a) - last(b) || a.localeCompare(b, "de"));
  for (const d of districts){
    const libs = byDistrict.get(d).sort((a, b) => lib(a).name.localeCompare(lib(b).name, "de"));
    const wrap = document.createElement("div"); wrap.className = "district";
    const id = "d-" + districtChecks.length;
    const head = document.createElement("div"); head.className = "dhead";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.setAttribute("aria-label", `All libraries in ${d}`);
    cb.onchange = () => { setOff(state.offLib, libs, !cb.checked); saveAndRender(); };
    const tog = document.createElement("button"); tog.className = "dtoggle"; tog.setAttribute("aria-controls", id);
    const name = document.createElement("span"); name.textContent = d;
    const n = document.createElement("span"); n.className = "n";
    const chev = document.createElement("span"); chev.className = "chev"; chev.setAttribute("aria-hidden", "true");
    tog.append(name, n, chev);
    const inner = document.createElement("div"); inner.className = "libs"; inner.id = id;
    const setOpen = open => { tog.setAttribute("aria-expanded", String(open)); inner.hidden = !open; };
    setOpen(state.openDistricts.has(d));
    tog.onclick = () => { const open = inner.hidden; setOpen(open); setOff(state.openDistricts, [d], open); save(); };
    head.append(cb, tog);
    districtChecks.push({cb, n, libs});
    for (const raw of libs){
      const info = lib(raw);
      const text = document.createDocumentFragment(); text.append(info.name);
      if (info.closed){ const c = document.createElement("span"); c.className = "closed"; c.textContent = " (closed)"; text.append(c); }
      const {lab, cb} = checkRow(text, null, on => { setOff(state.offLib, [raw], !on); saveAndRender(); });
      libChecks.set(raw, cb); inner.append(lab);
    }
    wrap.append(head, inner); box.append(wrap);
  }
}

function syncChecks(){
  for (const [p, cb] of platChecks) cb.checked = !state.offPlat.has(p);
  for (const [raw, cb] of libChecks) cb.checked = !state.offLib.has(raw);
  for (const {cb, n, libs} of districtChecks){
    const off = libs.filter(l => state.offLib.has(l)).length;
    cb.checked = off === 0; cb.indeterminate = off > 0 && off < libs.length;
    n.textContent = `${libs.length - off}/${libs.length}`;
  }
}

function setOff(set, keys, off){ for (const k of keys) off ? set.add(k) : set.delete(k); }
function saveAndRender(){ save(); render(); }
function resetFilters(){
  state.q = ""; state.sort = "az"; state.freeOnly = false; state.offPlat.clear(); state.offLib.clear();
  saveAndRender();
}

document.querySelectorAll("[data-all],[data-none]").forEach(b => b.onclick = () => {
  const plat = (b.dataset.all || b.dataset.none) === "plat";
  const set = plat ? state.offPlat : state.offLib;
  const keys = plat ? [...platChecks.keys()] : state.libs;
  setOff(set, keys, "none" in b.dataset); saveAndRender();
});
$("#q").oninput = e => { state.q = e.target.value; saveAndRender(); };
$("#sort").onchange = e => { state.sort = e.target.value; saveAndRender(); };
$("#freeOnly").onchange = e => { state.freeOnly = e.target.checked; saveAndRender(); };
$("#reset").onclick = resetFilters;

function showFilters(open){
  $("#filters").classList.toggle("shown", open); $("#scrim").classList.toggle("shown", open);
  $("#openFilters").setAttribute("aria-expanded", String(open));
  if (open) $("#closeFilters").focus(); else if (matchMedia("(max-width:860px)").matches) $("#openFilters").focus();
}
$("#openFilters").onclick = () => showFilters(true);
$("#closeFilters").onclick = () => showFilters(false);
$("#scrim").onclick = () => showFilters(false);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#filters").classList.contains("shown")) showFilters(false); });

fetch("games.json", {cache:"no-store"})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(load)
  .catch(() => load({updated:null,games:[]}));
</script>
</body>
</html>
